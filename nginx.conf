user nginx;
worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200M;

    server {
        listen 80;
        server_name af.cheqly.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Прямой доступ по IP (без домена) — отдаём по HTTP как есть, без редиректа на HTTPS,
    # т.к. TLS-сертификат выпущен только на af.cheqly.ru и по IP всё равно не подойдёт.
    server {
        listen 80 default_server;
        server_name 176.53.161.111 104.171.137.186;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "public, must-revalidate, max-age=0";
            proxy_hide_header Last-Modified;
            add_header Last-Modified $date_gmt;
        }

        location /static/ {
            alias /var/www/static/;
            expires 6M;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 6M;
            access_log off;
            add_header Content-Disposition 'inline';
            types {
                application/pdf pdf;
                application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
                application/msword doc;
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
                image/gif gif;
                image/svg+xml svg;
            }
            default_type application/octet-stream;
        }

        types {
            text/css css;
            application/javascript js;
            image/svg+xml svg svgz;
            image/x-icon ico;
        }
    }

    # HTTPS по IP. Сертификат выпущен только на af.cheqly.ru, поэтому без этого
    # блока запрос на https://<ip> попадал бы в server ниже и получал чужой
    # сертификат: TLS-рукопожатие проходит, и браузер показывает страницу с
    # ошибкой сертификата вместо того, чтобы откатиться на HTTP.
    #
    # Здесь рукопожатие обрывается сразу (сертификат для этого не нужен), так что
    # браузер, который сам поднял http:// до https://, получает отказ и
    # возвращается на HTTP — на IP-адресе он работает как есть, без редиректов.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        server_name af.cheqly.ru;

        ssl_certificate /etc/letsencrypt/live/af.cheqly.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/af.cheqly.ru/privkey.pem;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "public, must-revalidate, max-age=0";
            proxy_hide_header Last-Modified;
            add_header Last-Modified $date_gmt;
        }

        location /static/ {
            alias /var/www/static/;
            expires 6M;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 6M;
            access_log off;
            add_header Content-Disposition 'inline';
            types {
                application/pdf pdf;
                application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
                application/msword doc;
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
                image/gif gif;
                image/svg+xml svg;
            }
            default_type application/octet-stream;
        }

        types {
            text/css css;
            application/javascript js;
            image/svg+xml svg svgz;
            image/x-icon ico;
        }
    }
}
